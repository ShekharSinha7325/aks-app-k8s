apiVersion: apps/v1
kind: Deployment

metadata:
  name: aks-app-backend
  namespace: aks-app
  labels:
    app: aks-app-backend
    component: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-app-backend

  template:
    metadata:
      labels:
        app: aks-app-backend
        component: backend

    spec:
      containers:
        - name: aks-app-backend
          image: ghcr.io/shekharsinha7325/aks-app-backend:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: PORT
              value: "8000"

            - name: ENVIRONMENT
              value: "production"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: http

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12